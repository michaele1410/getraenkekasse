<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Eintrag bearbeiten</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 400px;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea, button {
            padding: 8px;
            margin-top: 4px;
        }
        button {
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Eintrag bearbeiten</h1>

    <form action="/edit/{{ eintrag[0] }}" method="post">
        <label for="datum">Datum:</label>
        <input type="date" name="datum" value="{{ eintrag[1] }}">

        <label for="vollgut">Vollgut:</label>
        <input type="number" name="vollgut" value="{{ eintrag[2] }}">

        <label for="leergut">Leergut:</label>
        <input type="number" name="leergut" value="{{ eintrag[3] }}">

        <label for="einnahme">Einnahme:</label>
        <input type="number" step="0.01" name="einnahme" value="{{ eintrag[5] or 0 }}">

        <label for="ausgabe">Ausgabe:</label>
        <input type="number" step="0.01" name="ausgabe" value="{{ eintrag[6] or 0 }}">

        <label for="bemerkung">Bemerkung:</label>
        <input type="text" name="bemerkung" value="{{ eintrag[8] }}">

        <button type="submit">Speichern</button>
    </form>

    <a href="/">Zurück zur Übersicht</a>
</body>
</html>
